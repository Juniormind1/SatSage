name: Build Linux webgui (x86_64)

# PyInstaller Onefile auf ubuntu-latest (x86_64). Hängt Assets an ein
# bestehendes Release an — erzeugt kein neues Release.
#
# Hinweis am Binary: GitHub-Build für Linux, ungetestet.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Bestehendes Release-Tag (Assets anhängen)"
        required: true
        default: "v0.9"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Systemabhängigkeiten (Tk für Splash)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk tcl tk libtk8.6

      - name: Linux-Binary bauen
        run: |
          chmod +x scripts/build_satsage_linux
          ./scripts/build_satsage_linux
          test -x dist/satsage-webgui
          file dist/satsage-webgui

      - name: Release-Assets benennen
        id: assets
        run: |
          set -euo pipefail
          NAME=satsage-webgui-linux-x86_64
          cp -f dist/satsage-webgui "dist/${NAME}"
          chmod +x "dist/${NAME}"
          HASH="$(sha256sum "dist/${NAME}" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$NAME" > "dist/${NAME}.sha256"
          {
            echo "SatSage Web-GUI — Linux x86_64 (GitHub Actions / ubuntu-latest)"
            echo
            echo "Datei: ${NAME}"
            echo "SHA-256: ${HASH}"
            echo
            echo "Hinweis: GitHub-Build für Linux, ungetestet."
            echo "Auf einem eigenen Linux-x86_64-Rechner prüfen, bevor du dich darauf verlässt."
            echo
            echo "Start:"
            echo "  chmod +x ${NAME}"
            echo "  ./${NAME}"
            echo
            echo ".env und Caches neben das Binary legen (Vorlage: .env.example im Repo)."
            echo "Lauscht lokal unter 127.0.0.1:8730."
          } > "dist/${NAME}.README.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}" "dist/${NAME}.sha256" "dist/${NAME}.README.txt"
          cat "dist/${NAME}.sha256"

      - name: An bestehendes Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          NAME: ${{ steps.assets.outputs.name }}
          HASH: ${{ steps.assets.outputs.hash }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            "dist/${NAME}" \
            "dist/${NAME}.sha256" \
            "dist/${NAME}.README.txt" \
            --clobber
          gh release view "$TAG" --json body -q .body > /tmp/release-body-old.md
          python3 scripts/update_release_notes_linux.py \
            --body-in /tmp/release-body-old.md \
            --body-out /tmp/release-body.md \
            --name "$NAME" \
            --hash "$HASH"
          TITLE="SatSage ${TAG} – Windows, macOS, Linux & StartOS"
          gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-body.md
          echo "Uploaded to https://github.com/${{ github.repository }}/releases/tag/${TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: satsage-webgui-linux-x86_64
          path: |
            dist/satsage-webgui-linux-x86_64
            dist/satsage-webgui-linux-x86_64.sha256
            dist/satsage-webgui-linux-x86_64.README.txt
          if-no-files-found: error

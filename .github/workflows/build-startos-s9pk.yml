name: Build StartOS s9pk (x86_64)

# Deaktiviert. Das Sideload-Paket wird lokal gebaut
# (scripts/build_startos_s9pk) und von Hand ans Release gehängt.
# Docs: doc/START9-packaging.md
on:
  workflow_dispatch:

jobs:
  deaktiviert:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow deaktiviert. Lokal bauen: ./scripts/build_startos_s9pk"

permissions:
  contents: read

jobs-disabled:
  labor:
    uses: ./.github/workflows/regtest-lab.yml

  s9pk:
    needs: labor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install squashfs and start-cli
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools squashfs-tools-ng jq
          curl -fsSL https://start9.com/start-cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo /usr/bin >> "$GITHUB_PATH"

      - name: npm ci
        run: npm ci

      - name: Start9 workspace + signing key
        working-directory: .
        run: |
          if [ -n "${{ secrets.STARTOS_BUILD_KEY }}" ]; then
            mkdir -p .startos
            printf '%s\n' "${{ secrets.STARTOS_BUILD_KEY }}" > .startos/build.key.pem
            chmod 600 .startos/build.key.pem
          fi
          if [ ! -d .startos ]; then
            start-cli s9pk init-workspace .
          fi

      - name: BTC-Preis-Bundle bis Tip
        working-directory: .
        run: |
          chmod +x scripts/refresh_btc_price_bundle.py
          python3 scripts/refresh_btc_price_bundle.py

      - name: make x86
        env:
          SKIP_BTC_PRICE_REFRESH: "1"
        run: make x86

      - name: Checksum
        run: |
          shopt -s nullglob
          for f in satsage_x86_64*.s9pk; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: satsage-startos-x86_64
          path: |
            packaging/satsage_x86_64*.s9pk
            packaging/satsage_x86_64*.s9pk.sha256
          if-no-files-found: error

      - name: Kurs-CSVs als Release-Asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -f data/btc_price/EUR.csv btc-price-EUR.csv
          cp -f data/btc_price/USD.csv btc-price-USD.csv
          gh release upload "${GITHUB_REF_NAME}" \
            btc-price-EUR.csv btc-price-USD.csv --clobber

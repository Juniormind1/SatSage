[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satsage-specterext"
version = "0.0.1"
description = "SatSage as Specter Desktop extension (dev scaffold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptoadvance.specter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"satsage.specterext.satsage" = [
    "templates/**/*",
    "static/**/*",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!-- Bisq · P2P-Escrow: zwei Parteien → gemeinsamer 2-of-2 → zwei Ausgänge.
       Amber (Trade/Markt), kein Markenlogo. Lesbar auf hell & dunkel. -->
  <g stroke="#C9922A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Links: zwei Funding-Inputs -->
    <circle cx="5.5" cy="10" r="2.4" fill="#C9922A" opacity="0.55"/>
    <circle cx="5.5" cy="22" r="2.4" fill="#C9922A" opacity="0.55"/>
    <path d="M8.2 10.8L12.2 14.2" opacity="0.85"/>
    <path d="M8.2 21.2L12.2 17.8" opacity="0.85"/>
    <!-- Mitte: Escrow / 2-of-2 (Raute) -->
    <path d="M16 9.5L21 16L16 22.5L11 16Z" fill="#C9922A" fill-opacity="0.25"/>
    <path d="M16 9.5L21 16L16 22.5L11 16Z"/>
    <circle cx="16" cy="16" r="1.6" fill="#E8C56A" stroke="none"/>
    <!-- Rechts: zwei Payout-Outputs -->
    <path d="M21.2 14.2L24.5 10.8" opacity="0.85"/>
    <path d="M21.2 17.8L24.5 21.2" opacity="0.85"/>
    <circle cx="26.5" cy="10" r="2.4" fill="#C9922A"/>
    <circle cx="26.5" cy="22" r="2.4" fill="#C9922A"/>
  </g>
</svg>
